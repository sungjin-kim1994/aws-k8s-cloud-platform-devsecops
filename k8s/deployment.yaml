apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsecops-app
  template:
    metadata:
      labels:
        app: devsecops-app
    spec:
      containers:
      - name: devsecops-app
        image: ghcr.io/sungjin-kim1994/devsecops-app:cad5991c2b1f8a86f44a0b95cbb1ac5c4f634644
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        # 응답 없으면 Service 분배 대상에서 제외 (격리)
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          periodSeconds: 5      # 5초마다 확인
          failureThreshold: 3   # 3번 연속 실패 시 격리
        # 계속 응답 없으면 컨테이너 재시작 (복구)
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          periodSeconds: 10     # 10초마다 확인
          failureThreshold: 3   # 3번 연속 실패 시 재시작
        # 리소스 요청, 상한: 스케줄러에 앱 크기를 알려줌, QoS BestEffort → Burstable (#21)
        # 값은 측정값(메모리 최대 35MiB, CPU 약 0.6m, 접속 없을 때) 기준 초기값
        resources:
          requests:
            memory: "64Mi"    # 실측 최대의 약 2배
            cpu: "50m"        # 1000m = 1 core
          limits:
            memory: "128Mi"   # 넘으면 강제 종료 (OOMKilled)
            cpu: "200m"       # 넘으면 느려짐 (throttling)
---
apiVersion: v1
kind: Service
metadata:
  name: devsecops-app-service
spec:
  type: NodePort
  selector:
    app: devsecops-app
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30080
