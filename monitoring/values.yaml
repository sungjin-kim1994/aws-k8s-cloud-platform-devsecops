# kube-prometheus-stack 설정: 기본값에서 바꾸는 것만 적음
# 맨 위 키(kube-prometheus-stack)는 Chart.yaml의 dependencies 이름과 같아야 함
#   → 틀리면 아래 설정 전체가 에러 없이 무시되고 기본값으로 설치됨
kube-prometheus-stack:

  # Alertmanager 끔: 알림 보낼 곳 미정 (경고는 Prometheus 화면에서 확인)
  alertmanager:
    enabled: false

  grafana:
    # 관리자 계정: Cluster에 직접 만든 Secret 사용 (Git에는 Secret 이름만)
    # Secret 안의 키 이름: admin-user, admin-password (Chart 기본값)
    admin:
      existingSecret: grafana-admin

    # test Pod 끔: ArgoCD는 Helm test를 배포하지 않음 → CI 검사 대상과 실제 배포 대상을 맞춤
    testFramework:
      enabled: false

    # sidecar Image: Chart 기본값(2.14.1)의 certifi 취약점(GHSA-6q48-6c7w-9gw2) 때문에 새 버전으로 올림 (#16)
    # Chart 기본값이 2.14.3 이상이 되면 이 설정은 지워도 됨
    sidecar:
      image:
        tag: "2.14.3"

  # Minikube 제어부 지표 수집 제외: 지표 port가 127.0.0.1에만 열려 있어 Prometheus가 접속 못 함 (#19)
  # 끄면 수집 대상, 경고 규칙, 제어부 대시보드가 함께 빠짐
  # port를 여는 Minikube 옵션은 Cluster 초기화 위험이 있어 보류 (#18), EKS에서도 이 기본 방식은 안 씀
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false