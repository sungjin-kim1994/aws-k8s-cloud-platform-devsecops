# kube-prometheus-stack 설정: 기본값에서 바꾸는 것만 적음
# 맨 위 키(kube-prometheus-stack)는 Chart.yaml의 dependencies 이름과 같아야 함
#   → 틀리면 아래 설정 전체가 에러 없이 무시되고 기본값으로 설치됨
kube-prometheus-stack:

  # Alertmanager 끔: 알림 보낼 곳 미정 (경고는 Prometheus 화면에서 확인)
  alertmanager:
    enabled: false

  grafana:
    # 관리자 계정: Cluster에 직접 만든 Secret 사용 (Git에는 Secret 이름만)
    # Secret 안의 키 이름: admin-user, admin-password (Chart 기본값)
    admin:
      existingSecret: grafana-admin

    # test Pod 끔: ArgoCD는 Helm test를 배포하지 않음 → CI 검사 대상과 실제 배포 대상을 맞춤
    testFramework:
      enabled: false

    # [실패 테스트] 오래된 Grafana Image로 image-scan 차단 확인 → 확인 후 git revert
    image:
      tag: "9.0.0"