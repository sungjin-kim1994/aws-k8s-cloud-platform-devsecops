name: CI-CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'app/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/sungjin-kim1994/devsecops-app:${{ github.sha }}
            ghcr.io/sungjin-kim1994/devsecops-app:latest

      - name: 매니페스트 이미지 태그 업데이트
        run: |
          sed -i "s|image: ghcr.io/.*/devsecops-app:.*|image: ghcr.io/sungjin-kim1994/devsecops-app:${{ github.sha }}|" k8s/deployment.yaml

      - name: 변경된 매니페스트 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --staged --quiet || git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]"
          git push
